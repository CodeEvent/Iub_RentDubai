services:
  ocr:
    build:
      context: ..
      dockerfile: docker/ocr.Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ocr-models:/root/.paddlex

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - api-data:/app/api/data
    environment:
      - PORT=4000
      - OCR_SERVICE_URL=http://ocr:8001
    depends_on:
      - ocr

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  api-data:
  ocr-models:
