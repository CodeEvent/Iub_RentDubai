services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - api-data:/app/api/data
    environment:
      - PORT=4000

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  api-data:
