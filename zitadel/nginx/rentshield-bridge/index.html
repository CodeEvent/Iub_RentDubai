<!doctype html>
<!--
  ZITADEL migration Phase D (2026-09-22) counterpart of
  authelia/nginx/rentshield-bridge/index.html -- a separate copy, not an
  in-place edit, because that file is still what the LIVE Authelia
  signup flow serves; this one is reached only via the ZITADEL side door
  (zitadel.rentshield.local:9092) until Phase F's cutover.

  Same origin-bound-to-RP-id constraint as the Authelia version's own
  comment explains (confirmed live for ZITADEL too: rp.id in the
  creation options this page receives is "zitadel.rentshield.local"),
  so this ceremony still can't run directly on RentShield's own domain
  -- but where the Authelia version called its IdP's API directly, this
  one calls back into Django (documents/rentshield_views.py's
  zitadel_passkey_start_view/verify_view) instead, since
  RegisterPasskey/VerifyPasskeyRegistration need the ZITADEL provisioner
  PAT, and that PAT must never reach the browser. Authorized by a
  single-use nonce in the URL (see zitadel_provisioning.py's
  issue_passkey_nonce) instead of the `description` query param the
  Authelia version used -- ZITADEL requires no equivalent to start the
  ceremony, only passkey_name later, on verify.

  Design tokens below are a literal copy of documents/templates/rentshield/
  signup_base.html's <style> block -- see /DESIGN.md. Same reasoning as
  the Authelia version for why this is a hand-kept duplicate, not a
  shared build step.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Register your passkey</title>
<style>
    :root {
        --rs-bg: #09090b;
        --rs-surface: #18181b;
        --rs-border: #27272a;
        --rs-text: #e8eaed;
        --rs-text-muted: #8b93a1;
        --rs-accent: #7c6cf6;
        --rs-accent-strong: #9b8cff;
        --rs-verified: #10b981;
        --rs-danger: #fb7185;
        --rs-danger-bg: #2a1215;
        --rs-font: -apple-system, "Segoe UI", Inter, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
        background: var(--rs-bg);
        color: var(--rs-text);
        font-family: var(--rs-font);
        margin: 0;
    }
    .rs-wizard { max-width: 26rem; margin: 4rem auto; padding: 0 1.25rem; }
    .rs-card {
        background: var(--rs-surface);
        border: 1px solid var(--rs-border);
        border-radius: 8px;
        padding: 1.5rem;
        transition: border-color .15s ease-out, box-shadow .15s ease-out;
    }
    .rs-card:focus-within {
        border-color: var(--rs-accent);
        box-shadow: 0 0 0 3px rgba(124, 108, 246, .12);
    }
    .rs-card.rs-card-verified {
        border-color: var(--rs-verified);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, .2);
    }
    .rs-wizard h1 { font-size: 1.4rem; font-weight: 600; line-height: 1.25; margin: 0 0 .7rem; }
    .rs-wizard-hint { color: var(--rs-text-muted); font-size: .92rem; line-height: 1.5; margin: 0 0 1.3rem; }
    .rs-status { color: var(--rs-text-muted); font-size: .85rem; margin-top: .8rem; }
    .rs-wizard-error {
        background: var(--rs-danger-bg);
        border-left: 3px solid var(--rs-danger);
        color: var(--rs-danger);
        padding: .85rem 1rem;
        margin: 1rem 0 0;
        font-size: .9rem;
        border-radius: 0 6px 6px 0;
        display: none;
    }
    .rs-wizard-error.rs-visible { display: block; }
    .rs-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        border: none;
        border-radius: 6px;
        font-size: .95rem;
        font-weight: 600;
        font-family: var(--rs-font);
        padding: .7rem 1.4rem;
        cursor: pointer;
        width: 100%;
        transition: background-color .15s ease-out, opacity .15s ease-out;
    }
    .rs-btn-primary { background: var(--rs-accent); color: var(--rs-bg); }
    .rs-btn-primary:hover:not(:disabled) { background: var(--rs-accent-strong); }
    .rs-btn:disabled { opacity: .55; cursor: not-allowed; }
    .rs-link { color: var(--rs-text-muted); font-size: .85rem; text-decoration: none; display: inline-block; margin-top: 1rem; }
    .rs-link:hover { color: var(--rs-text); text-decoration: underline; }
    .rs-spinner {
        width: 1em; height: 1em;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: .85;
        animation: rs-spin .6s linear infinite;
    }
    @keyframes rs-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
        .rs-spinner { animation-duration: 1.6s; }
        .rs-card, .rs-btn { transition: none; }
    }
</style>
</head>
<body>
<div class="rs-wizard">
    <div class="rs-card" id="rs-card">
        <h1 id="rs-heading">Register your passkey</h1>
        <p class="rs-wizard-hint" id="rs-hint">
            Use your face, fingerprint, or device screen lock to create a passkey for this
            account. Nothing to type or remember.
        </p>
        <button type="button" class="rs-btn rs-btn-primary" id="rs-register-btn">
            <span id="rs-btn-label">Register with biometrics</span>
        </button>
        <div class="rs-status" id="rs-status" hidden></div>
        <div class="rs-wizard-error" id="rs-error"></div>
    </div>
    <a class="rs-link" id="rs-back-link" href="#">Cancel and go back</a>
</div>
<script>
(function () {
  'use strict';

  // Dev-only allowlist -- mirrors the redirect_uris already listed in
  // authelia/configuration.secrets.yml for the same reason. A real
  // deployment replaces this with RentShield's real origin(s).
  var ALLOWED_RETURN_ORIGINS = [
    'https://app.rentshield.local:8443',
  ];
  var DJANGO_API_BASE = 'https://app.rentshield.local:8443';

  var params = new URLSearchParams(window.location.search);
  var description = params.get('description') || 'My passkey';
  var returnTo = params.get('return');
  var nonce = params.get('nonce');

  var card = document.getElementById('rs-card');
  var btn = document.getElementById('rs-register-btn');
  var btnLabel = document.getElementById('rs-btn-label');
  var status = document.getElementById('rs-status');
  var errorBox = document.getElementById('rs-error');
  var backLink = document.getElementById('rs-back-link');

  function succeed() {
    var url = new URL(returnTo);
    url.searchParams.set('passkeyAdded', '1');
    window.location.replace(url.toString());
  }

  if (!returnTo || ALLOWED_RETURN_ORIGINS.indexOf(new URL(returnTo).origin) === -1 || !nonce) {
    document.body.textContent = 'This page must be reached from RentShield.';
    return;
  }

  backLink.href = returnTo;

  function showError(message) {
    errorBox.textContent = message + ' -- you can try again below.';
    errorBox.classList.add('rs-visible');
  }

  function setLoading(isLoading) {
    btn.disabled = isLoading;
    if (isLoading) {
      btnLabel.innerHTML = '<span class="rs-spinner" aria-hidden="true"></span> Waiting for your device…';
      status.hidden = false;
      status.textContent = 'Follow the prompt from your browser or device now.';
    } else {
      btnLabel.textContent = 'Register with biometrics';
      status.hidden = true;
    }
  }

  // Django endpoints, not ZITADEL's own API -- see this file's own
  // header comment on why (the admin-level provisioner PAT stays
  // server-side). credentials: 'omit' is deliberate, not an oversight:
  // this deliberately doesn't rely on any shared cookie, only the
  // single-use nonce already in the URL -- see zitadel_provisioning.py's
  // issue_passkey_nonce for why.
  async function djangoApi(path, body) {
    var res = await fetch(DJANGO_API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      credentials: 'omit',
    });
    var data = await res.json().catch(function () { return null; });
    if (!res.ok || (data && data.error)) {
      throw new Error((data && data.error) || ('Request failed: ' + res.status));
    }
    return data;
  }

  async function register() {
    errorBox.classList.remove('rs-visible');
    setLoading(true);
    try {
      var startResult = await djangoApi('/zitadel/passkey/start', { nonce: nonce });
      var creationOptions = startResult && startResult.publicKey;
      if (!creationOptions) {
        throw new Error('ZITADEL did not return WebAuthn creation options.');
      }
      var passkeyId = startResult.passkeyId;
      var publicKey = PublicKeyCredential.parseCreationOptionsFromJSON(creationOptions);
      // Confirmed live (2026-09-21): Chromium does not reliably honor
      // publicKey.timeout on its own -- with no platform authenticator
      // enrolled and no security key plugged in, navigator.credentials
      // .create() just sits pending forever instead of rejecting once
      // that timeout elapses, leaving the button stuck on "Waiting for
      // your device..." with no error and no way back except the
      // separate "Cancel and go back" link. AbortSignal.timeout gives
      // this its own client-side deadline so the promise always settles.
      var credential = await navigator.credentials.create({
        publicKey: publicKey,
        signal: AbortSignal.timeout((creationOptions.timeout || 120000) + 1000),
      });
      if (!credential) {
        throw new Error('No credential was created.');
      }
      await djangoApi('/zitadel/passkey/verify', {
        nonce: nonce,
        passkeyId: passkeyId,
        publicKeyCredential: credential.toJSON(),
        passkeyName: description,
      });
      card.classList.add('rs-card-verified');
      btnLabel.textContent = 'Passkey registered';
      status.hidden = false;
      status.textContent = 'Taking you back to RentShield…';
      setTimeout(succeed, 500);
    } catch (err) {
      // The most common case by far: the person's OS/browser cancelled
      // its own biometric prompt (they backed out, timed out, or the
      // platform authenticator wasn't available) -- surfaced as
      // NotAllowedError by the WebAuthn spec, not a server-side failure,
      // so it's shown here rather than redirected away where the same
      // message would flash past on navigation.
      setLoading(false);
      if (err && err.name === 'TimeoutError') {
        showError('Timed out waiting for your device');
      } else {
        showError(err && err.message ? err.message : String(err));
      }
    }
  }

  if (!window.PublicKeyCredential) {
    btn.disabled = true;
    showError('This browser does not support passkeys');
    return;
  }

  btn.addEventListener('click', register);
})();
</script>
</body>
</html>
