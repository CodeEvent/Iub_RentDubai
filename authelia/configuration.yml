# Authelia -- self-hosted OIDC identity provider for RentShield
# (2026-09-15, requested explicitly: "single source of truth" for both
# the web app and the native Android app). Runs purely as an OIDC
# Provider here -- NOT the more commonly-documented forward-auth-behind-
# a-reverse-proxy deployment, which this project has no use for (no
# other app needs gating, and Django already speaks OIDC natively via
# allauth's own openid_connect provider). See the plan file / session
# notes for the full architecture writeup.
#
# All secret VALUES live under authelia/secrets/ (gitignored, generated
# once via `docker run authelia/authelia:latest authelia crypto ...`,
# see README) and are wired in via the `_FILE`-suffixed env vars in
# docker-compose.yml, never inlined here.

theme: 'light'

server:
  address: 'tcp://:9091'
  # Plain HTTP -- TLS now terminates at the nginx proxy in front of this
  # (authelia/nginx/, 2026-09-15) instead of here, so it can see
  # plaintext HTML/JSON to strip Authelia's own branding and inject
  # RentShield's styling (see nginx.conf's own header comment). This
  # container is no longer published to the host directly -- only nginx
  # is, reachable from it over the compose network by service name.
  #
  # Authelia's own session cookie domain flatly refuses a bare LAN IP or
  # `localhost` (confirmed against Authelia's own docs: it "must be a
  # standard-use domain... which a globally trusted Certificate
  # Authority is willing to issue X.509 Certificates for" -- a real,
  # separate blocker from the WebAuthn secure-context caveat, since it
  # applies to every login method, not just passkeys). `auth.
  # rentshield.local` is a dev-only stand-in, still true with TLS moved
  # to nginx: mapped to this machine's LAN IP via /etc/hosts, with a
  # locally-trusted mkcert certificate (now at nginx.conf's
  # ssl_certificate) -- a real deployment needs a real registrable
  # domain + a real CA-issued certificate instead of both of these.

log:
  level: 'info'

# File-backed users -- deliberately not LDAP, this project's scale
# doesn't warrant it.
# ponytail: flat-file auth backend, one process's worth of users. If
# this ever needs to scale past what one YAML file can reasonably hold
# (many dozens of users, self-service password resets at real volume),
# switch authentication_backend to `ldap` instead -- Authelia supports
# both, the rest of this config (OIDC, sessions, storage) doesn't change.
authentication_backend:
  # No password should ever be resettable, changeable, or typeable by a
  # real person here (2026-09-15/18, requested explicitly: "no one
  # should use passwords") -- both are genuine, supported config
  # switches (confirmed against Authelia's own schema, not guessed),
  # unlike the /api/secondfactor/password fallback below, which has no
  # config knob and needed an actual source patch (see this repo's
  # vendor/authelia/ fork and its own README). Every account still has
  # *a* password hash internally -- Authelia's file backend schema
  # requires the field to exist -- but with reset/change disabled here
  # and the fallback route removed in the fork, it is genuinely
  # unreachable through this deployment, not just hidden in the UI.
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: '/config/users_database.yml'
    # Django writes new users directly into this file now (2026-09-15,
    # requested explicitly: Authelia is the only signup/signin path --
    # its own file backend has no self-service registration of its own,
    # see documents/rentshield/authelia_provisioning.py) -- watch means
    # a freshly-provisioned account can log in immediately, no restart
    # needed.
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# This deployment is WebAuthn/passkey-only -- TOTP was never wired into
# any RentShield UI and no account has one (2026-09-18, requested
# explicitly: "no one should use passwords" -- a lingering unused second
# method is the same kind of dead-end surface, not a password itself
# but the same shape of problem). Disabling it outright, not just
# leaving it unused, fixes a real, confirmed-live bug: Authelia's
# SecondFactorForm caches the user's last-picked method in this
# browser's own localStorage (a single key, not scoped per account), so
# testing several accounts in one browser can leave a *different*
# account's webauthn-preferring session defaulting to a TOTP screen
# instead -- which then offers to "register" TOTP via a full detour
# into Settings, a page that has no business appearing mid-login.
# Disabling TOTP entirely removes that route/screen/detour altogether,
# so there is nothing left for the stale cached value to misfire into.
totp:
  disable: true

# Not used for forward-auth here (see header comment) -- Authelia still
# requires an access_control block for its own portal pages (account
# settings, password reset). two_factor (2026-09-15) now that WebAuthn
# passkey enrollment is enabled below -- the actual RentShield login
# gate is identity_providers.oidc's per-client authorization_policy in
# configuration.secrets.yml, not this; this just matches it for
# Authelia's own pages.
access_control:
  default_policy: 'two_factor'

# WebAuthn passkeys as the second factor (2026-09-15, requested
# explicitly: "type login details, then a QR, then biometric confirms,
# then access is granted" -- that's a passkey, not another NFC/chip
# read; see this session's own notes on why NFC stays a one-time
# identity-proofing step, not a per-login gate). No custom enrollment
# UI needed -- Authelia's own account settings page already has a
# self-service "Register device" flow, and WebAuthn is one of its
# available second-factor methods by default (nothing to individually
# turn on beyond this section existing + access_control/the OIDC
# client's authorization_policy above requiring two_factor).
webauthn:
  display_name: 'RentShield'
  # Fully passwordless, single-tap sign-in (2026-09-15/17, requested
  # explicitly: "everything must be passwordless") --
  # enable_passkey_login lets a user authenticate with just a passkey,
  # no password prompt at all; experimental_enable_passkey_uv_two_factors
  # lets that same tap (with the authenticator's own user verification)
  # satisfy the *entire* two_factor policy in one ceremony -- confirmed
  # live: passkey sign-in lands straight on OIDC consent, zero extra
  # screens. Both purely additive -- accounts that still have a real
  # password keep working via the old path too.
  #
  # The uv_two_factors flag has one real, confirmed bug: Authelia's own
  # "Add Device" dialog (its built-in React UI) fails every registration
  # attempt while this is on -- "You cancelled the attestation request",
  # zero server-side log trace (the browser rejects
  # navigator.credentials.create() before any request reaches Authelia).
  # Isolated via an automated Playwright + CDP-virtual-authenticator run,
  # one flag at a time -- confirmed this is specific to Authelia's own
  # dialog, not the underlying registration API: calling the same
  # endpoints directly (authelia/nginx/rentshield-bridge/index.html,
  # what every "register a passkey" link in this app now uses instead of
  # Authelia's own portal) registers cleanly with this flag on. Re-test
  # Authelia's own dialog after upgrading before relying on it again.
  enable_passkey_login: true
  experimental_enable_passkey_uv_two_factors: true
  # Default is 60 seconds (2026-09-15) -- confirmed live as the actual
  # cause of repeated "stuck at Authelia after 2FA" reports: taking more
  # than a minute to read the prompt and touch the key expires the
  # in-progress OIDC flow ("Unsuccessful WebAuthn authentication
  # attempt... error=Session has Expired"), so Authelia just finishes
  # the plain login instead of completing the redirect back to
  # RentShield. This is a real UX gap in Authelia's own default, not
  # something specific to this setup.
  timeout: '120 seconds'

session:
  name: 'authelia_session'
  same_site: 'lax'
  expiration: '1h'
  inactivity: '15m'
  remember_me: '1M'
  cookies:
    # domain is the shared parent 'rentshield.local', not the literal
    # 'auth.rentshield.local' host (2026-09-15) -- so the cookie is
    # same-site (not cross-site) from RentShield's own app.rentshield.local,
    # letting My Profile's Security tab call Authelia's API directly, no
    # popup/redirect needed for anything except the actual WebAuthn
    # "add a passkey" ceremony (a separate, unrelated browser rule tied
    # to Authelia's own hostname -- confirmed live this doesn't move with
    # this cookie-domain change, see the plan file). authelia_url stays
    # Authelia's own exact URL, unaffected.
    - domain: 'rentshield.local'
      authelia_url: 'https://auth.rentshield.local:9091'

storage:
  local:
    path: '/config/db.sqlite3'

# Dev-only: writes password-reset/notification emails to a file instead
# of sending real mail, matching how PAPERLESS_EMAIL_ENABLED already
# gates real email off in this project's own dev setup. A real
# deployment needs a real `smtp` notifier instead.
notifier:
  filesystem:
    filename: '/config/notification.txt'

# identity_providers.oidc (jwks signing key + client_secret hash) is
# deliberately NOT in this file -- both are secret material that can't
# be addressed by Authelia's env-var `_FILE` convention (that only
# covers scalar, non-array config paths; jwks/clients are lists). See
# `configuration.secrets.yml` (gitignored, same directory) for that
# section -- Authelia loads both files together (`-c configuration.yml
# -c configuration.secrets.yml`, see docker-compose.yml), merged.
