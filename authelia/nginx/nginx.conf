# Fronts Authelia (2026-09-15, requested explicitly: strip "Authelia"
# branding, match RentShield's own look) -- TLS moves here from Authelia
# itself, since the overrides below need to see plaintext HTML/JSON,
# which a passthrough proxy sitting in front of Authelia's own TLS
# listener could never do. See authelia/configuration.yml's server.tls
# section (now removed) and this repo's plan file for the full
# reasoning -- particularly why this ISN'T a naive text sub_filter on
# Authelia's HTML (its frontend is a client-rendered SPA; "Powered by
# Authelia" doesn't exist in the HTML at all, only after its JS runs).

events {}

http {
    server {
        listen 9091 ssl;
        server_name auth.rentshield.local;

        ssl_certificate     /etc/nginx/certs/auth.rentshield.local.pem;
        ssl_certificate_key /etc/nginx/certs/auth.rentshield.local-key.pem;

        # Real, fetchable static files Authelia itself serves (confirmed
        # live, not guessed) -- overridden outright rather than proxied,
        # so this survives Authelia upgrades as long as these two paths
        # keep existing, regardless of anything else in its JS bundles.
        location = /locales/en/portal.json {
            alias /etc/nginx/rentshield/locales/en/portal.json;
            default_type application/json;
        }

        location = /manifest.json {
            alias /etc/nginx/rentshield/manifest.json;
            default_type application/json;
        }

        location = /rentshield-authelia-theme.css {
            alias /etc/nginx/rentshield/rentshield-authelia-theme.css;
            default_type text/css;
        }

        # The My-Profile "Security" tab's add-a-passkey redirect target
        # (2026-09-15, see this file's own comment in the bridge page
        # itself) -- served directly, never proxied to Authelia, so it's
        # never subject to Authelia's own X-Frame-Options/CSP (moot
        # anyway, it's reached via a same-tab redirect, never framed).
        location = /rentshield-bridge/index.html {
            # A trailing slash on the location pattern -- even with no
            # `index` directive -- makes nginx treat the alias as a
            # directory and append its own default index.html lookup on
            # top, producing a literal "...index.htmlindex.html" path
            # (confirmed live, 2026-09-17, 500 error). The location
            # pattern has to name the file exactly, same as
            # manifest.json/the theme CSS just above -- no trailing
            # slash, no directory alias.
            alias /etc/nginx/rentshield/rentshield-bridge/index.html;
            default_type text/html;
        }

        # CORS for the My-Profile "Security" tab (2026-09-15) -- Angular
        # calls these endpoints directly from app.rentshield.local now
        # (same *site* as this domain, since both share the parent
        # rentshield.local and the session cookie's domain was widened
        # to match -- see authelia/configuration.yml -- so the cookie
        # itself flows with no help needed here). CORS is a separate,
        # origin-level check on top of that: SameSite only governs the
        # cookie, it says nothing about whether cross-origin JS may read
        # the response, which is what this block opts into. Authelia has
        # no CORS support of its own to configure, so it lives here.
        location /api/ {
            proxy_pass http://authelia:9091;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin 'https://app.rentshield.local:8443' always;
            add_header Access-Control-Allow-Credentials 'true' always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin 'https://app.rentshield.local:8443';
                add_header Access-Control-Allow-Credentials 'true';
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
                # X-CSRFToken: Angular's HttpClient attaches this to
                # every request automatically (it's meant for Django's
                # own CSRF check, not Authelia's -- Authelia ignores it),
                # confirmed live as the actual reason preflight was
                # failing ("Request header field x-csrftoken is not
                # allowed").
                add_header Access-Control-Allow-Headers 'Content-Type, X-CSRFToken';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Everything else, including every other locale/asset call,
        # proxied straight through to Authelia. Accept-Encoding "" is
        # required: sub_filter can't match text inside a gzip-compressed
        # body, so Authelia's own compression has to be disabled for
        # this hop (nginx still compresses its own response to the
        # browser independently, if configured to).
        location / {
            # Bounces a direct visit to the bare root (no active OIDC
            # flow -- confirmed live, every real mid-flow hit here
            # carries ?flow=openid_connect&flow_id=...) back to
            # RentShield's own welcome page instead of showing
            # Authelia's own portal (2026-09-18, requested explicitly --
            # this page should only ever be reached as an invisible
            # step in the middle of clicking "Sign in with a passkey"
            # from RentShield itself, never visited directly). Combining
            # two conditions into one $uri/$arg_flow string instead of
            # nesting `if` blocks -- nginx's own docs call nested `if`
            # unreliable/unsupported, this concatenation trick is the
            # standard workaround. Deeper paths (/2fa/webauthn,
            # /consent/..., /settings/...) all still proxy through
            # normally, matched or not -- this only fires for the exact
            # root path.
            set $rentshield_root_no_flow "";
            if ($uri = '/') {
                set $rentshield_root_no_flow "root";
            }
            if ($arg_flow = '') {
                set $rentshield_root_no_flow "${rentshield_root_no_flow}noflow";
            }
            if ($rentshield_root_no_flow = 'rootnoflow') {
                return 302 https://app.rentshield.local:8443/welcome/;
            }

            proxy_pass http://authelia:9091;
            # nginx defaults to HTTP/1.0 for the upstream leg, which
            # Authelia's Go server bluntly rejects with a bare "400 Bad
            # Request" (no JSON body, not even Authelia's own error
            # format) on at least some routes -- real error hit live,
            # not a preemptive guess.
            proxy_http_version 1.1;
            # $host strips the port -- Authelia matches the request's
            # effective issuer/session-cookie config against the FULL
            # host:port (session.cookies[].authelia_url is
            # https://auth.rentshield.local:9091, port included), so a
            # bare hostname made it reject every request with "no
            # session cookie configuration matches url
            # 'https://auth.rentshield.local'" (real error hit live).
            # $http_host preserves whatever the client actually sent.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            # sub_filter only touches text/html by default (sub_filter_types) --
            # the JS/CSS/JSON also served through this same location block
            # pass through completely untouched.
            sub_filter '<title></title>' '<title>RentShield</title>';
            sub_filter '</head>' '<link rel="stylesheet" href="/rentshield-authelia-theme.css"></head>';
            sub_filter_once off;
        }
    }
}
