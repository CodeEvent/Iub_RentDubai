# Full-stack compose for this fork: paperless-ngx (built from the
# vendored ./Dockerfile) + rentshield's document-parsing services
# (docling-service, optionally deepseek-ocr-service) + its e-signature
# engines (docuseal, opensign). paperless-ngx's own docker/compose/*.yml
# variants (sqlite/postgres/mariadb, with/without Tika) are untouched —
# this file is new, specific to this fork, and deliberately simple
# (sqlite, no Tika).
services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - broker
      - docling-service
      - docuseal
      - opensign
      - authelia
    ports:
      - "8000:8000"
    volumes:
      - pgx-data:/usr/src/paperless/data
      - pgx-media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - jibri-recordings:/usr/src/paperless/jibri-recordings
      # Authelia's dev-only TLS cert is signed by a local mkcert CA, not
      # a real public one -- Python's `requests` (which allauth's OIDC
      # discovery/token/userinfo calls go through) needs to be told to
      # trust it explicitly via REQUESTS_CA_BUNDLE below.
      - ./authelia/certs/rootCA.pem:/usr/src/paperless/authelia-ca.pem:ro
    environment:
      # Passwordless SSO via Authelia (2026-09-15) -- see
      # authelia/configuration.yml's header comment for the full
      # architecture. AUTHELIA_OIDC_CLIENT_SECRET is the plaintext
      # counterpart of authelia/configuration.secrets.yml's
      # client_secret hash -- set it in a real (gitignored) .env file,
      # never inline here; see authelia/secrets/
      # oidc_client_secret_plaintext.txt for the generated value.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"SCOPE": ["openid", "profile", "email", "groups"],
        "APPS": [{"provider_id": "authelia", "name": "RentShield",
        "client_id": "rentshield", "secret": "${AUTHELIA_OIDC_CLIENT_SECRET:-}",
        "settings": {"server_url": "https://auth.rentshield.local:9091",
        "token_auth_method": "client_secret_post"}}]}}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      # RentShield is now also reachable at app.rentshield.local over
      # HTTPS (2026-09-15, see nginx/app-proxy/) -- Django requires an
      # HTTPS request's Origin to be explicitly trusted for CSRF, unlike
      # the plain-HTTP localhost:8000 path this was unset for before.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://app.rentshield.local:8443
      REQUESTS_CA_BUNDLE: /usr/src/paperless/authelia-ca.pem
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: sqlite
      DOCLING_SERVICE_URL: http://docling-service:8010
      DEEPSEEK_OCR_SERVICE_URL: http://deepseek-ocr-service:8011
      DEEPSEEK_OCR_ENABLED: ${DEEPSEEK_OCR_ENABLED:-false}
      # e-signature (rentshield/esign/) — see "Notarization" in the README
      ESIGN_PRIMARY: docuseal
      ESIGN_FALLBACK: opensign
      DOCUSEAL_URL: http://docuseal:3000
      DOCUSEAL_API_TOKEN: ${DOCUSEAL_API_TOKEN:-}
      OPENSIGN_URL: http://opensign:8080
      OPENSIGN_APP_ID: rentshield
      OPENSIGN_MASTER_KEY: ${OPENSIGN_MASTER_KEY:-change-me-in-prod}
      OPENSIGN_SERVICE_USER_ID: ${OPENSIGN_SERVICE_USER_ID:-}
      # Self-hosted Jitsi (jitsi-web et al. below) — see
      # RENTSHIELD_JITSI_BASE_URL's own comment in paperless/settings/
      # __init__.py for why this needs a real domain+HTTPS in production.
      PAPERLESS_RENTSHIELD_JITSI_BASE_URL: ${RENTSHIELD_JITSI_BASE_URL:-http://localhost:8444}
      PAPERLESS_RENTSHIELD_JIBRI_RECORDINGS_DIR: /usr/src/paperless/jibri-recordings

  # Self-hosted OIDC identity provider (2026-09-15, requested
  # explicitly: "single source of truth" for auth across both the web
  # app and the native Android app -- see authelia/configuration.yml's
  # own header comment for the full architecture reasoning). Runs as a
  # plain OIDC Provider only -- no forward-auth needed, Django talks to
  # it directly via allauth's own openid_connect provider. Not reachable
  # from the host directly any more (no `ports`) -- `authelia-proxy`
  # below is now the only externally-reachable entry point, see its own
  # header comment for why (strips "Authelia" branding, injects
  # RentShield's own styling -- needs to see plaintext HTML/JSON, so TLS
  # moved there too).
  authelia:
    # RentShield fork (2026-09-18, requested explicitly: "delete the
    # passwords intake field and the ability to use the passwords") --
    # a custom build of Authelia v4.39.26 from source (vendor/authelia/,
    # a git clone of the matching upstream tag) with password
    # authentication genuinely removed, not just hidden: the
    # POST /api/secondfactor/password route (upstream's password
    # fallback for a passkey login that didn't carry full user
    # verification) is deleted from internal/server/handlers.go, the
    # login page's username/password form is gone from
    # FirstFactorForm.tsx (replaced with a "Sign up" link to
    # RentShield's own /signup/), and LoginPortal.tsx's second-factor
    # routing sends an unverified passkey login to a second WebAuthn tap
    # instead of that now-deleted password screen. See
    # vendor/authelia/Dockerfile.rentshield for the build and this
    # session's own notes for the full reasoning -- rebuild with
    # `docker buildx build -f vendor/authelia/Dockerfile.rentshield -t
    # rentshield/authelia:custom --load vendor/authelia` (after
    # temporarily swapping in vendor/authelia/.dockerignore.rentshield,
    # since the repo's own .dockerignore is written for a different,
    # packaging-only Dockerfile) whenever vendor/authelia/ changes.
    # Tradeoff accepted explicitly: an account whose passkey never
    # achieves user verification (no biometric hardware/PIN-secured
    # authenticator) can still sign in -- via a second WebAuthn tap --
    # but can never fall back to a password, ever, on this deployment.
    image: rentshield/authelia:custom
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      # Scalar secrets only -- the OIDC signing key + client secret hash
      # are list-typed config paths _FILE env vars can't address, so
      # those come from configuration.secrets.yml instead (merged in via
      # `entrypoint` below).
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session_secret.txt
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset_password_jwt_secret.txt
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage_encryption_key.txt
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /config/secrets/oidc_hmac_secret.txt
    entrypoint: ["authelia", "--config=/config/configuration.yml,/config/configuration.secrets.yml"]

  # Fronts `authelia` above (2026-09-15, requested explicitly: remove
  # "Authelia" branding from its own hosted pages, match RentShield's
  # look). TLS terminates HERE now (mkcert cert for auth.rentshield.local,
  # same one Authelia used to hold directly -- see nginx.conf's own
  # header comment for why a passthrough proxy in front of Authelia's own
  # TLS couldn't do this). Holds the `auth.rentshield.local` network
  # alias `authelia` itself used to have -- both the browser-facing LAN
  # IP and Django's own SOCIALACCOUNT_PROVIDERS server_url hit this
  # container now, unchanged from the outside (same host:port), just
  # with Authelia one hop further back.
  authelia-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - authelia
    ports:
      - "9091:9091"
    volumes:
      - ./authelia/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authelia/nginx/locales:/etc/nginx/rentshield/locales:ro
      - ./authelia/nginx/manifest.json:/etc/nginx/rentshield/manifest.json:ro
      - ./authelia/nginx/rentshield-authelia-theme.css:/etc/nginx/rentshield/rentshield-authelia-theme.css:ro
      - ./authelia/nginx/rentshield-bridge:/etc/nginx/rentshield/rentshield-bridge:ro
      - ./authelia/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - auth.rentshield.local

  # Fronts the bare Django dev server at app.rentshield.local (2026-09-15)
  # -- see nginx/app-proxy/nginx.conf's own header comment for why this
  # exists (shares a parent domain with Authelia so its session cookie
  # can flow same-site).
  app-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/app-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authelia/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - app.rentshield.local

  docling-service:
    build:
      context: ./docling-service
    restart: unless-stopped
    ports:
      - "8010:8010"

  # e-signature engines behind the "Notarization Service" add-on
  # (rentshield/esign/) — DocuSeal is primary, OpenSign the automatic
  # fallback. Same two services legacy-v1/docker/docker-compose.yml ran.
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - docuseal-data:/data
    environment:
      - FORCE_SSL=false

  opensign-mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - opensign-mongo-data:/data/db

  opensign:
    image: opensign/opensignserver:main
    restart: unless-stopped
    depends_on:
      - opensign-mongo
    ports:
      - "8081:8080"
    volumes:
      - opensign-files:/usr/src/app/files
    environment:
      - NODE_ENV=production
      - APP_ID=rentshield
      - MASTER_KEY=${OPENSIGN_MASTER_KEY:-change-me-in-prod}
      - MONGODB_URI=mongodb://opensign-mongo:27017/opensign
      - SERVER_URL=http://localhost:8081/app
      - PUBLIC_URL=http://localhost:8081

  # Self-hosted video call for the identity-verification Notary review
  # (documents/rentshield_identity/models.py's IdentityVerificationCall)
  # -- official jitsi/docker-jitsi-meet images. This is a genuinely
  # heavier stack than every other service above (XMPP + a video bridge
  # + a headless-Chrome recorder), and this block covers the minimal
  # working set for local/dev use over plain HTTP on localhost (WebRTC
  # allows camera/mic on localhost without TLS) — a real deployment
  # needs a real domain + HTTPS for jitsi-web (see
  # RENTSHIELD_JITSI_BASE_URL's own comment in paperless/settings/
  # __init__.py) and should tighten the XMPP secrets below via a real
  # .env file rather than the checked-in dev defaults.
  jitsi-web:
    image: jitsi/web:stable
    restart: unless-stopped
    ports:
      - "8444:80"
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    environment:
      - ENABLE_HTTPS=0
      - PUBLIC_URL=${RENTSHIELD_JITSI_BASE_URL:-http://localhost:8444}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - ENABLE_RECORDING=1

  jitsi-prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped
    volumes:
      - jitsi-prosody-config:/config
    environment:
      - AUTH_TYPE=internal
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET:-devsecret-jicofo-component}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD:-devsecret-jicofo-auth}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD:-devsecret-jvb-auth}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-devsecret-jibri-recorder}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JITSI_JIBRI_XMPP_PASSWORD:-devsecret-jibri-xmpp}
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET:-devsecret-jicofo-component}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD:-devsecret-jicofo-auth}
      - JICOFO_ENABLE_HEALTH_CHECKS=false

  jitsi-jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD:-devsecret-jvb-auth}
      # A real (non-localhost) deployment MUST set this to the host's
      # real public IP -- otherwise clients behind NAT can't establish
      # media. Fine to leave unset for local dev.
      - DOCKER_HOST_ADDRESS=${JITSI_DOCKER_HOST_ADDRESS:-}

  # Recording (see IdentityVerificationCall's own docstring on why this
  # is manually triggered by the Notary, not orchestrated by RentShield
  # itself) -- writes finished recordings into the jibri-recordings
  # volume, shared with `webserver` below so
  # run_video_call_recording_ingest_task can pick them up.
  jitsi-jibri:
    image: jitsi/jibri:stable
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: 2gb
    volumes:
      - jibri-recordings:/config/recordings
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-devsecret-jibri-recorder}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JITSI_JIBRI_XMPP_PASSWORD:-devsecret-jibri-xmpp}
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_LOGS_DIR=/config/logs
      - JIBRI_RECORDING_DIR=/config/recordings
      - JIBRI_STRIP_DOMAIN_JID=muc.meet.jitsi
      - DISPLAY=:0

  # GPU-only — see deepseek-ocr-service/README.md. Not started by
  # `docker compose up` unless the "gpu" profile is enabled
  # (`docker compose --profile gpu up`), since it fails without a real
  # CUDA GPU + the NVIDIA Container Toolkit.
  deepseek-ocr-service:
    build:
      context: ./deepseek-ocr-service
    restart: unless-stopped
    profiles: ["gpu"]
    ports:
      - "8011:8011"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgx-data:
  pgx-media:
  redisdata:
  docuseal-data:
  opensign-mongo-data:
  opensign-files:
  jitsi-prosody-config:
  jibri-recordings:
